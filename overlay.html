<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>TikTok Live Chat Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Segoe UI", "Sarabun", sans-serif;
    overflow: hidden;
  }
  #chat-box {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 480px;
    max-height: 60vh;
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    overflow: hidden;
  }
  .chat-line {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(18, 16, 26, 0.65);
    color: #fff;
    padding: 9px 16px 9px 9px;
    border-radius: 20px 20px 20px 4px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5);
    font-size: 17px;
    line-height: 1.4;
    animation: slide-in 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
    word-break: break-word;
  }
  .avatar {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 2px;
    background-clip: content-box, border-box;
    background-origin: content-box, border-box;
    text-transform: uppercase;
    overflow: hidden;
    position: relative;
  }
  .avatar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.05));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .chat-body { min-width: 0; }
  .chat-line .nickname {
    color: #ffd54a;
    font-weight: 700;
    font-size: 14.5px;
    margin-right: 6px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  .chat-line .comment {
    color: #f2f2f5;
  }
  .gift-line {
    background: linear-gradient(120deg, rgba(120, 78, 10, 0.85), rgba(200, 140, 30, 0.85), rgba(120, 78, 10, 0.85));
    background-size: 220% 220%;
    border: 1px solid rgba(255, 210, 100, 0.5);
    align-items: center;
    animation: slide-in 0.28s cubic-bezier(0.2, 0.8, 0.3, 1), shimmer 3s ease-in-out infinite;
  }
  .gift-line .nickname { color: #fff3c4; }
  .member-line {
    background: rgba(20, 40, 30, 0.55);
    border: 1px solid rgba(120, 230, 160, 0.35);
    font-size: 15px;
    padding-top: 7px;
    padding-bottom: 7px;
  }
  .member-line .nickname { color: #8ef0ac; }
  .member-line .comment { color: rgba(255, 255, 255, 0.75); }
  .gift-count {
    color: #ffe27a;
    font-weight: 700;
    display: inline-block;
    animation: pop 0.4s ease-out;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  .gift-icon {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    object-fit: contain;
    animation: pop 0.4s ease-out;
    margin-left: auto;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  #tts-toggle {
    position: fixed;
    bottom: calc(60vh + 24px + 10px);
    left: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #tts-toggle.off {
    opacity: 0.45;
  }
</style>
</head>
<body>
  <button id="tts-toggle" title="เปิด/ปิดเสียงอ่านแชท"></button>
  <div id="chat-box"></div>

  <script src="/vendor/confetti.js"></script>
  <script>
    // Match the WS_PORT set in server.js
    const WS_URL = "ws://localhost:8081";
    const MAX_LINES = 20;
    const chatBox = document.getElementById("chat-box");

    // Toggle TTS on/off; persisted so a page refresh (or OBS reload) keeps the choice.
    const ttsToggleBtn = document.getElementById("tts-toggle");
    let ttsEnabled = localStorage.getItem("ttsEnabled") !== "off";

    const TTS_ICON_ON =
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 9v6h4l5 5V4L8 9H4z"/>' +
      '<path d="M16.5 8.5a5 5 0 0 1 0 7"/>' +
      '<path d="M19 6a9 9 0 0 1 0 12"/>' +
      "</svg>";
    const TTS_ICON_OFF =
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 9v6h4l5 5V4L8 9H4z"/>' +
      '<path d="M16 9l6 6"/>' +
      '<path d="M22 9l-6 6"/>' +
      "</svg>";

    function renderTtsToggle() {
      ttsToggleBtn.innerHTML = ttsEnabled ? TTS_ICON_ON : TTS_ICON_OFF;
      ttsToggleBtn.classList.toggle("off", !ttsEnabled);
    }

    ttsToggleBtn.addEventListener("click", () => {
      ttsEnabled = !ttsEnabled;
      localStorage.setItem("ttsEnabled", ttsEnabled ? "on" : "off");
      renderTtsToggle();
      if (!ttsEnabled) stopSpeaking();
    });

    renderTtsToggle();

    // Anti-spam: if the same person repeats the same comment more than 3
    // times in a row, keep showing the chat bubble but stop reading it aloud.
    const SPAM_REPEAT_LIMIT = 3;
    const lastCommentByUser = new Map();

    function isSpamRepeat(userKey, comment) {
      const prev = lastCommentByUser.get(userKey);
      const count = prev && prev.text === comment ? prev.count + 1 : 1;
      lastCommentByUser.set(userKey, { text: comment, count });
      return count > SPAM_REPEAT_LIMIT;
    }

    // Collapses a repeated pattern inside a single message down to 3 reps
    // before reading it aloud, e.g. "####" -> "###", "#$@#$@#$@#$@" -> "#$@#$@#$@".
    // Tries pattern lengths 1-12 chars (non-greedy) and cuts anything repeating 4+ times.
    function collapseRepeatsForSpeech(text) {
      return text.replace(/(.{1,12}?)\1{3,}/g, (_match, group) => group.repeat(3));
    }

    // Comments matching this are still shown in chat but never read aloud.
    // "หี" + any Thai tone mark (่ ้ ๊ ๋, U+0E48-U+0E4B) or with no tone mark at all, plus "แตด".
    // The lookahead excludes words like "หีบ" where a consonant follows (i.e. "หี" isn't the whole syllable).
    const BLOCKED_TTS_PATTERN = /หี[่-๋]?(?![ก-ฮ])|แตด/;

    function containsBlockedWord(text) {
      return BLOCKED_TTS_PATTERN.test(text);
    }

    // Small confetti burst near the bottom-left chat box whenever a gift comes in.
    // canvas-confetti is loaded from CDN in <head>; skip quietly if it failed to load.
    function celebrateGift() {
      if (typeof confetti !== "function") return;
      confetti({
        particleCount: 60,
        spread: 65,
        startVelocity: 45,
        origin: { x: 0.15, y: 0.85 },
        colors: ["#ffd54a", "#ff8a5c", "#ff5b7a", "#7c5cff"],
      });
    }

    function connect() {
      const ws = new WebSocket(WS_URL);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "gift") {
          addGiftLine(data.nickname, data.giftName, data.repeatCount, data.avatarUrl, data.giftImage);
          celebrateGift();
          const times = data.repeatCount > 1 ? ` ${data.repeatCount} ชิ้น` : "";
          speak(`ขอบคุณ ${data.nickname} ที่ส่ง ${data.giftName}${times}`);
          return;
        }

        if (data.type === "member") {
          addMemberLine(data.nickname, data.avatarUrl);
          return;
        }

        if (data.type !== "chat") return;
        addChatLine(data.nickname, data.comment, data.avatarUrl);
        const userKey = data.user || data.nickname;
        if (!isSpamRepeat(userKey, data.comment) && !containsBlockedWord(data.comment)) {
          speak(`${data.nickname} ${collapseRepeatsForSpeech(data.comment)}`);
        }
      };

      ws.onclose = () => {
        setTimeout(connect, 3000);
      };
    }

    // Consistent, distinct color per nickname so avatars stay recognizable
    // across messages without needing real profile pictures.
    const AVATAR_COLORS = ["#ff5b7a", "#7c5cff", "#22c1c3", "#f7b733", "#3fa9f5", "#ff8a5c", "#8bd346"];

    function colorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[hash % AVATAR_COLORS.length];
    }

    function createAvatar(nickname, avatarUrl) {
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.style.background = colorForName(nickname);
      avatar.textContent = (nickname.trim()[0] || "?");

      if (avatarUrl) {
        const img = document.createElement("img");
        img.src = avatarUrl;
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        // If the TikTok CDN url fails to load, fall back to the letter avatar
        // that's already sitting behind it.
        img.onerror = () => img.remove();
        avatar.appendChild(img);
      }
      return avatar;
    }

    function pushLine(line) {
      chatBox.prepend(line);
      while (chatBox.children.length > MAX_LINES) {
        chatBox.removeChild(chatBox.lastChild);
      }
    }

    function addChatLine(nickname, comment, avatarUrl) {
      const line = document.createElement("div");
      line.className = "chat-line";

      const body = document.createElement("div");
      body.className = "chat-body";
      body.innerHTML = `<span class="nickname">${escapeHtml(nickname)}</span><span class="comment">${escapeHtml(comment)}</span>`;

      line.appendChild(createAvatar(nickname, avatarUrl));
      line.appendChild(body);
      pushLine(line);
    }

    function addGiftLine(nickname, giftName, repeatCount, avatarUrl, giftImage) {
      const line = document.createElement("div");
      line.className = "chat-line gift-line";

      const body = document.createElement("div");
      body.className = "chat-body";
      const times = repeatCount > 1 ? ` <span class="gift-count">x${repeatCount}</span>` : "";
      body.innerHTML =
        `<span class="nickname">${escapeHtml(nickname)}</span>` +
        `<span class="comment">ส่ง ${escapeHtml(giftName)}${times}</span>`;

      line.appendChild(createAvatar(nickname, avatarUrl));
      line.appendChild(body);

      if (giftImage) {
        const icon = document.createElement("img");
        icon.className = "gift-icon";
        icon.src = giftImage;
        icon.alt = "";
        icon.referrerPolicy = "no-referrer";
        icon.onerror = () => icon.remove();
        line.appendChild(icon);
      }

      pushLine(line);
    }

    function addMemberLine(nickname, avatarUrl) {
      const line = document.createElement("div");
      line.className = "chat-line member-line";

      const body = document.createElement("div");
      body.className = "chat-body";
      body.innerHTML = `<span class="nickname">${escapeHtml(nickname)}</span><span class="comment">เข้าห้องไลฟ์</span>`;

      line.appendChild(createAvatar(nickname, avatarUrl));
      line.appendChild(body);
      pushLine(line);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Thai TTS via Google Translate's public TTS endpoint, proxied through our
    // own server (see /tts in server.js) since Chrome blocks the browser from
    // hitting translate.google.com directly (ORB). No API key needed.
    // Google caps each request at ~200 chars, so long text is split into chunks
    // and queued to play one after another (avoids overlapping audio when
    // multiple chat messages arrive close together).
    const TTS_CHUNK_LIMIT = 200;
    const TTS_VOLUME = 0.4; // 0.0 (เงียบ) - 1.0 (เต็ม)
    const TTS_SPEED = 1.50; // 1.0 = ปกติ, >1 = อ่านเร็วขึ้น, <1 = ช้าลง
    const speakQueue = [];
    let isSpeaking = false;
    let currentAudio = null;

    function speak(text) {
      if (!ttsEnabled) return;
      speakQueue.push(text);
      if (!isSpeaking) processQueue();
    }

    // Drops any queued messages and immediately silences whatever's playing
    // right now — used when the user toggles TTS off mid-speech.
    function stopSpeaking() {
      speakQueue.length = 0;
      if (currentAudio) {
        currentAudio.onended = null;
        currentAudio.onerror = null;
        currentAudio.pause();
        currentAudio = null;
      }
      isSpeaking = false;
    }

    function processQueue() {
      if (speakQueue.length === 0) {
        isSpeaking = false;
        return;
      }
      isSpeaking = true;
      const chunks = splitForTts(speakQueue.shift(), TTS_CHUNK_LIMIT);
      playChunks(chunks, 0, processQueue);
    }

    function splitForTts(text, maxLen) {
      const chunks = [];
      let rest = text;
      while (rest.length > maxLen) {
        let cut = rest.lastIndexOf(" ", maxLen);
        if (cut <= 0) cut = maxLen;
        chunks.push(rest.slice(0, cut));
        rest = rest.slice(cut).trim();
      }
      if (rest) chunks.push(rest);
      return chunks;
    }

    function playChunks(chunks, i, onDone) {
      if (i >= chunks.length) {
        onDone();
        return;
      }
      // Same-origin proxy in server.js — calling translate.google.com directly
      // from the browser gets blocked by Chrome's ORB (net::ERR_BLOCKED_BY_ORB).
      const url = "/tts?text=" + encodeURIComponent(chunks[i]);
      const audio = new Audio(url);
      audio.volume = TTS_VOLUME;
      audio.playbackRate = TTS_SPEED;
      currentAudio = audio;
      const next = () => playChunks(chunks, i + 1, onDone);
      audio.onended = next;
      audio.onerror = () => {
        console.warn("Google TTS โหลดเสียงไม่สำเร็จ ข้ามท่อนนี้ไป:", chunks[i]);
        next();
      };
      audio.play().catch((err) => {
        console.warn("audio.play() ถูกบล็อก:", err.name, err.message);
        next();
      });
    }

    connect();
  </script>
</body>
</html>
