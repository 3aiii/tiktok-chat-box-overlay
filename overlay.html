<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>TikTok Live Chat Overlay</title>
<style>
  @font-face {
    font-family: "Kanit";
    src: url("/fonts/Kanit-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Kanit";
    src: url("/fonts/Kanit-Medium.ttf") format("truetype");
    font-weight: 500;
  }
  @font-face {
    font-family: "Kanit";
    src: url("/fonts/Kanit-SemiBold.ttf") format("truetype");
    font-weight: 600;
  }
  @font-face {
    font-family: "Kanit";
    src: url("/fonts/Kanit-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  @font-face {
    font-family: "Kanit";
    src: url("/fonts/Kanit-ExtraBold.ttf") format("truetype");
    font-weight: 800;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Kanit", "Segoe UI", "Sarabun", sans-serif;
    overflow: hidden;
  }
  #chat-box {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 580px;
    max-height: 60vh;
    display: flex;
    flex-direction: column-reverse;
    gap: 12px;
    overflow: hidden;
  }
  #chat-box.overflowing {
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 60px);
    mask-image: linear-gradient(to bottom, transparent, black 60px);
  }
  .chat-line {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    animation: slide-in 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
    max-width: 100%;
  }
  .line-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: 16px;
    margin-bottom: -12px;
    z-index: 1;
  }
  .badge {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  .badge img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  .badge-gift { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
  .badge-member { background: linear-gradient(135deg, #f472b6, #ec4899); }
  .avatar {
    flex: 0 0 auto;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #7c5cff, #22c1c3);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    text-transform: uppercase;
    overflow: hidden;
    /* box-shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.5); */
  }
  .avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  .nickname {
    background: rgba(255, 246, 232, 0.92);
    color: #5a3418;
    font-weight: 800;
    font-size: 16px;
    padding: 6px 17px;
    border-radius: 999px;
    box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.45);
    white-space: nowrap;
  }
  .bubble {
    background: linear-gradient(150deg, #ffd9a8, #ffaf5e);
    color: #4a2600;
    padding: 17px 22px 12px;
    border-radius: 26px 26px 26px 8px;
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.5);
    font-size: 19px;
    line-height: 1.4;
    word-break: break-word;
  }
  .comment { color: #4a2600; }
  .gift-line .bubble {
    background: linear-gradient(120deg, #ffe259, #d4900a, #ffe259);
    background-size: 220% 220%;
    color: #3d2400;
    font-weight: 700;
    font-size: 15px;
    border: 2px solid rgba(255, 224, 130, 0.95);
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.5), 0 0 22px -2px rgba(255, 190, 40, 0.65);
    animation: shimmer 3s ease-in-out infinite;
  }
  .gift-line .comment { color: #3d2400; }
  .gift-line .nickname {
    background: linear-gradient(135deg, #ffe259, #d4900a);
    color: #3d2400;
    box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.45), 0 0 12px -2px rgba(255, 190, 40, 0.5);
  }
  .member-line .bubble {
    background: linear-gradient(150deg, #ffe8c9, #ffcf94);
    font-size: 18px;
  }
  .gift-count {
    color: #3d2400;
    font-weight: 800;
    display: inline-block;
    animation: pop 0.4s ease-out;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  .gift-icon {
    display: block;
    width: 42px;
    height: 42px;
    object-fit: contain;
    object-position: center;
    margin: 6px auto 0;
    animation: pop 0.4s ease-out;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  #tts-toggle {
    position: fixed;
    bottom: calc(60vh + 24px + 10px);
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #tts-toggle.off {
    opacity: 0.45;
  }
  .pinnable {
    cursor: pointer;
  }
  .pinnable .bubble {
    transition: box-shadow 0.15s ease-out;
  }
  .pinnable:hover .bubble {
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(124, 92, 255, 0.6);
  }
  .pinnable.pinned .bubble {
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.5), 0 0 0 3px #7c5cff;
  }
  #pinned-banner {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-12px);
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 720px;
    background: rgba(20, 12, 40, 0.85);
    border: 2px solid #7c5cff;
    color: #fff;
    padding: 10px 22px;
    border-radius: 999px;
    box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.6);
    font-size: 18px;
    transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    z-index: 20;
  }
  #pinned-banner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  #pinned-banner .pin-icon { flex: 0 0 auto; font-size: 18px; }
  #pinned-banner .pin-nickname { flex: 0 0 auto; font-weight: 800; color: #c9b8ff; }
  #pinned-banner .pin-comment { flex: 1 1 auto; word-break: break-word; }
</style>
</head>
<body>
  <button id="tts-toggle" title="เปิด/ปิดเสียงอ่านแชท"></button>
  <div id="pinned-banner"></div>
  <div id="chat-box"></div>

  <script src="/vendor/confetti.js"></script>
  <script>
    // Match the WS_PORT set in server.js
    const WS_URL = "ws://localhost:8081";
    const MAX_LINES = 20;
    const chatBox = document.getElementById("chat-box");

    // Toggle TTS on/off; persisted so a page refresh (or OBS reload) keeps the choice.
    const ttsToggleBtn = document.getElementById("tts-toggle");
    let ttsEnabled = localStorage.getItem("ttsEnabled") !== "off";

    const TTS_ICON_ON =
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 9v6h4l5 5V4L8 9H4z"/>' +
      '<path d="M16.5 8.5a5 5 0 0 1 0 7"/>' +
      '<path d="M19 6a9 9 0 0 1 0 12"/>' +
      "</svg>";
    const TTS_ICON_OFF =
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 9v6h4l5 5V4L8 9H4z"/>' +
      '<path d="M16 9l6 6"/>' +
      '<path d="M22 9l-6 6"/>' +
      "</svg>";

    function renderTtsToggle() {
      ttsToggleBtn.innerHTML = ttsEnabled ? TTS_ICON_ON : TTS_ICON_OFF;
      ttsToggleBtn.classList.toggle("off", !ttsEnabled);
    }

    ttsToggleBtn.addEventListener("click", () => {
      ttsEnabled = !ttsEnabled;
      localStorage.setItem("ttsEnabled", ttsEnabled ? "on" : "off");
      renderTtsToggle();
      if (!ttsEnabled) stopSpeaking();
    });

    renderTtsToggle();

    // Anti-spam: if the same person repeats the same comment more than 3
    // times in a row, keep showing the chat bubble but stop reading it aloud.
    const SPAM_REPEAT_LIMIT = 3;
    const lastCommentByUser = new Map();

    function isSpamRepeat(userKey, comment) {
      const prev = lastCommentByUser.get(userKey);
      const count = prev && prev.text === comment ? prev.count + 1 : 1;
      lastCommentByUser.set(userKey, { text: comment, count });
      return count > SPAM_REPEAT_LIMIT;
    }

    // Collapses a repeated pattern inside a single message down to 3 reps
    // before reading it aloud, e.g. "####" -> "###", "#$@#$@#$@#$@" -> "#$@#$@#$@".
    // Tries pattern lengths 1-12 chars (non-greedy) and cuts anything repeating 4+ times.
    function collapseRepeatsForSpeech(text) {
      return text.replace(/(.{1,12}?)\1{3,}/g, (_match, group) => group.repeat(3));
    }

    // Comments matching this are still shown in chat but never read aloud.
    // "หี" + any Thai tone mark (่ ้ ๊ ๋, U+0E48-U+0E4B) or with no tone mark at all, plus "แตด".
    // The lookahead excludes words like "หีบ" where a consonant follows (i.e. "หี" isn't the whole syllable).
    const BLOCKED_TTS_PATTERN = /หี[่-๋]?(?![ก-ฮ])|แตด/;

    function containsBlockedWord(text) {
      return BLOCKED_TTS_PATTERN.test(text);
    }

    // Small confetti burst near the bottom-left chat box whenever a gift comes in.
    // canvas-confetti is loaded from CDN in <head>; skip quietly if it failed to load.
    function celebrateGift() {
      if (typeof confetti !== "function") return;
      confetti({
        particleCount: 60,
        spread: 65,
        startVelocity: 45,
        origin: { x: 0.85, y: 0.85 },
        colors: ["#ffd54a", "#ff8a5c", "#ff5b7a", "#7c5cff"],
      });
    }

    function connect() {
      const ws = new WebSocket(WS_URL);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "gift") {
          addGiftLine(data.nickname, data.giftName, data.repeatCount, data.avatarUrl, data.giftImage);
          celebrateGift();
          const times = data.repeatCount > 1 ? ` ${data.repeatCount} ชิ้น` : "";
          speak(`ขอบคุณ ${data.nickname} ที่ส่ง ${data.giftName}${times}`);
          return;
        }

        if (data.type === "member") {
          return;
        }

        if (data.type !== "chat") return;
        addChatLine(data.nickname, data.comment, data.avatarUrl);
        const userKey = data.user || data.nickname;
        if (!isSpamRepeat(userKey, data.comment) && !containsBlockedWord(data.comment)) {
          speak(`${data.nickname} ${collapseRepeatsForSpeech(data.comment)}`);
        }
      };

      ws.onclose = () => {
        setTimeout(connect, 3000);
      };
    }

    // Real TikTok profile picture only — no letter-avatar fallback. Returns
    // null when there's no avatarUrl, or removes itself from the DOM if the
    // CDN image fails to load.
    function createAvatar(avatarUrl) {
      if (!avatarUrl) return null;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      const img = document.createElement("img");
      img.src = avatarUrl;
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      img.onerror = () => avatar.remove();
      avatar.appendChild(img);
      return avatar;
    }

    // Small role badge shown next to the avatar (only for gift/member lines,
    // matching the reference design where plain chat has no badge).
    function createBadge(badgeClass, fallbackEmoji) {
      const badge = document.createElement("div");
      badge.className = `badge ${badgeClass}`;
      badge.textContent = fallbackEmoji;
      return badge;
    }

    function pushLine(line) {
      chatBox.prepend(line);
      while (chatBox.children.length > MAX_LINES) {
        chatBox.removeChild(chatBox.lastChild);
      }
      // Only fade the top edge once messages actually overflow the box —
      // otherwise a single early comment gets faded for no reason.
      chatBox.classList.toggle("overflowing", chatBox.scrollHeight > chatBox.clientHeight);
    }

    function buildLine(extraClass, nickname, avatarUrl, badge) {
      const line = document.createElement("div");
      line.className = extraClass ? `chat-line ${extraClass}` : "chat-line";

      const header = document.createElement("div");
      header.className = "line-header";
      const avatar = createAvatar(avatarUrl);
      if (avatar) header.appendChild(avatar);
      if (badge) header.appendChild(badge);
      const nick = document.createElement("span");
      nick.className = "nickname";
      nick.textContent = nickname;
      header.appendChild(nick); 

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      line.appendChild(header);
      line.appendChild(bubble);
      return { line, bubble };
    }

    function addChatLine(nickname, comment, avatarUrl) {
      const { line, bubble } = buildLine("", nickname, avatarUrl, null);
      line.querySelector(".nickname").textContent += ":";
      bubble.innerHTML = `<span class="comment">${escapeHtml(comment)}</span>`;
      line.classList.add("pinnable");
      line.dataset.nickname = nickname;
      line.dataset.comment = comment;
      pushLine(line);
    }

    // Click a chat bubble to pin it to the banner at the top of the screen
    // (e.g. to highlight a question worth answering on stream). Clicking the
    // pinned bubble again, or a different one, updates/clears the banner.
    // Only plain chat comments are pinnable — gift/member/follow lines aren't.
    const pinnedBanner = document.getElementById("pinned-banner");
    let pinnedLine = null;

    function setPinnedBanner(nickname, comment) {
      pinnedBanner.innerHTML =
        '<span class="pin-icon">📌</span>' +
        `<span class="pin-nickname">${escapeHtml(nickname)}</span>` +
        `<span class="pin-comment">${escapeHtml(comment)}</span>`;
      pinnedBanner.classList.add("show");
    }

    function clearPinnedBanner() {
      pinnedBanner.classList.remove("show");
    }

    chatBox.addEventListener("click", (event) => {
      const line = event.target.closest(".pinnable");
      if (!line) return;

      if (line === pinnedLine) {
        line.classList.remove("pinned");
        pinnedLine = null;
        clearPinnedBanner();
        return;
      }

      if (pinnedLine) pinnedLine.classList.remove("pinned");
      line.classList.add("pinned");
      pinnedLine = line;
      setPinnedBanner(line.dataset.nickname, line.dataset.comment);
    });

    function addGiftLine(nickname, giftName, repeatCount, avatarUrl, giftImage) {
      // const badge = createBadge("badge-gift", "🎁");
      const { line, bubble } = buildLine("gift-line", nickname, avatarUrl, null);
      const times = repeatCount > 1 ? ` <span class="gift-count">x${repeatCount}</span>` : "";
      bubble.innerHTML = `<span class="comment">ส่ง ${escapeHtml(giftName)}${times}</span>`;

      // if (giftImage) {
      //   const icon = document.createElement("img");
      //   icon.className = "gift-icon";
      //   icon.src = giftImage;
      //   icon.alt = "";
      //   icon.referrerPolicy = "no-referrer";
      //   icon.onerror = () => icon.remove();
      //   bubble.appendChild(icon);
      // }

      pushLine(line);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Thai TTS via Google Translate's public TTS endpoint, proxied through our
    // own server (see /tts in server.js) since Chrome blocks the browser from
    // hitting translate.google.com directly (ORB). No API key needed.
    // Google caps each request at ~200 chars, so long text is split into chunks
    // and queued to play one after another (avoids overlapping audio when
    // multiple chat messages arrive close together).
    const TTS_CHUNK_LIMIT = 200;
    const TTS_VOLUME = 0.4; // 0.0 (เงียบ) - 1.0 (เต็ม)
    const TTS_SPEED = 1.50; // 1.0 = ปกติ, >1 = อ่านเร็วขึ้น, <1 = ช้าลง
    const speakQueue = [];
    let isSpeaking = false;
    let currentAudio = null;

    function speak(text) {
      if (!ttsEnabled) return;
      speakQueue.push(text);
      if (!isSpeaking) processQueue();
    }

    // Drops any queued messages and immediately silences whatever's playing
    // right now — used when the user toggles TTS off mid-speech.
    function stopSpeaking() {
      speakQueue.length = 0;
      if (currentAudio) {
        currentAudio.onended = null;
        currentAudio.onerror = null;
        currentAudio.pause();
        currentAudio = null;
      }
      isSpeaking = false;
    }

    function processQueue() {
      if (speakQueue.length === 0) {
        isSpeaking = false;
        return;
      }
      isSpeaking = true;
      const chunks = splitForTts(speakQueue.shift(), TTS_CHUNK_LIMIT);
      playChunks(chunks, 0, processQueue);
    }

    function splitForTts(text, maxLen) {
      const chunks = [];
      let rest = text;
      while (rest.length > maxLen) {
        let cut = rest.lastIndexOf(" ", maxLen);
        if (cut <= 0) cut = maxLen;
        chunks.push(rest.slice(0, cut));
        rest = rest.slice(cut).trim();
      }
      if (rest) chunks.push(rest);
      return chunks;
    }

    function playChunks(chunks, i, onDone) {
      if (i >= chunks.length) {
        onDone();
        return;
      }
      // Same-origin proxy in server.js — calling translate.google.com directly
      // from the browser gets blocked by Chrome's ORB (net::ERR_BLOCKED_BY_ORB).
      const url = "/tts?text=" + encodeURIComponent(chunks[i]);
      const audio = new Audio(url);
      audio.volume = TTS_VOLUME;
      audio.playbackRate = TTS_SPEED;
      currentAudio = audio;
      const next = () => playChunks(chunks, i + 1, onDone);
      audio.onended = next;
      audio.onerror = () => {
        console.warn("Google TTS โหลดเสียงไม่สำเร็จ ข้ามท่อนนี้ไป:", chunks[i]);
        next();
      };
      audio.play().catch((err) => {
        console.warn("audio.play() ถูกบล็อก:", err.name, err.message);
        next();
      });
    }

    connect();
  </script>
</body>
</html>
