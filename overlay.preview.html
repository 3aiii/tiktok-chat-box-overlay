<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Overlay Preview (mock data)</title>
<style>
  @font-face {
    font-family: "Kanit";
    src: url("fonts/Kanit-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Kanit";
    src: url("fonts/Kanit-Medium.ttf") format("truetype");
    font-weight: 500;
  }
  @font-face {
    font-family: "Kanit";
    src: url("fonts/Kanit-SemiBold.ttf") format("truetype");
    font-weight: 600;
  }
  @font-face {
    font-family: "Kanit";
    src: url("fonts/Kanit-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  @font-face {
    font-family: "Kanit";
    src: url("fonts/Kanit-ExtraBold.ttf") format("truetype");
    font-weight: 800;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #1c1c1c;
    font-family: "Kanit", "Segoe UI", "Sarabun", sans-serif;
    overflow: hidden;
  }
  #chat-box {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 580px;
    max-height: 60vh;
    display: flex;
    flex-direction: column-reverse;
    gap: 12px;
    overflow: hidden;
  }
  #chat-box.overflowing {
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 60px);
    mask-image: linear-gradient(to bottom, transparent, black 60px);
  }
  .chat-line {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0;
    animation: slide-in 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
    max-width: 100%;
  }
  .line-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-right: 16px;
    margin-bottom: -12px;
    z-index: 1;
  }
  .badge {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  .badge img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  .badge-gift { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
  .badge-member { background: linear-gradient(135deg, #f472b6, #ec4899); }
  .avatar {
    flex: 0 0 auto;
    width: 31px;
    height: 31px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #7c5cff, #22c1c3);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    text-transform: uppercase;
    overflow: hidden;
    box-shadow: 0 2px 6px -2px rgba(0, 0, 0, 0.5);
  }
  .avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  .nickname {
    background: rgba(255, 246, 232, 0.92);
    color: #5a3418;
    font-weight: 800;
    font-size: 16px;
    padding: 6px 17px;
    border-radius: 999px;
    box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.45);
    white-space: nowrap;
  }
  .bubble {
    background: linear-gradient(150deg, #ffd9a8, #ffaf5e);
    color: #4a2600;
    padding: 17px 22px 12px;
    border-radius: 26px 26px 8px 26px;
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.5);
    font-size: 19px;
    line-height: 1.4;
    word-break: break-word;
  }
  .comment { color: #4a2600; }
  .gift-line .bubble {
    background: linear-gradient(120deg, #ffe259, #d4900a, #ffe259);
    background-size: 220% 220%;
    color: #3d2400;
    font-weight: 700;
    font-size: 20px;
    border: 2px solid rgba(255, 224, 130, 0.95);
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.5), 0 0 22px -2px rgba(255, 190, 40, 0.65);
    animation: shimmer 3s ease-in-out infinite;
  }
  .gift-line .comment { color: #3d2400; }
  .gift-line .nickname {
    background: linear-gradient(135deg, #ffe259, #d4900a);
    color: #3d2400;
    box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.45), 0 0 12px -2px rgba(255, 190, 40, 0.5);
  }
  .member-line .bubble {
    background: linear-gradient(150deg, #ffe8c9, #ffcf94);
    font-size: 18px;
  }
  .gift-count {
    color: #3d2400;
    font-weight: 800;
    display: inline-block;
    animation: pop 0.4s ease-out;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  .gift-icon {
    display: block;
    width: 42px;
    height: 42px;
    object-fit: contain;
    object-position: center;
    margin: 6px auto 0;
    animation: pop 0.4s ease-out;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>
  <div id="chat-box"></div>

  <script src="node_modules/canvas-confetti/dist/confetti.browser.js"></script>
  <script>
    // canvas-confetti is loaded above from node_modules directly (this file
    // opens via file:// with no server, so it can't hit /vendor/confetti.js).
    function celebrateGift() {
      if (typeof confetti !== "function") return;
      confetti({
        particleCount: 60,
        spread: 65,
        startVelocity: 45,
        origin: { x: 0.85, y: 0.85 },
        colors: ["#ffd54a", "#ff8a5c", "#ff5b7a", "#7c5cff"],
      });
    }

    const MAX_LINES = 20;
    const chatBox = document.getElementById("chat-box");

    function createAvatar(avatarUrl) {
      if (!avatarUrl) return null;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      const img = document.createElement("img");
      img.src = avatarUrl;
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      img.onerror = () => avatar.remove();
      avatar.appendChild(img);
      return avatar;
    }

    function createBadge(badgeClass, fallbackEmoji) {
      const badge = document.createElement("div");
      badge.className = `badge ${badgeClass}`;
      badge.textContent = fallbackEmoji;
      return badge;
    }

    function pushLine(line) {
      chatBox.prepend(line);
      while (chatBox.children.length > MAX_LINES) {
        chatBox.removeChild(chatBox.lastChild);
      }
      chatBox.classList.toggle("overflowing", chatBox.scrollHeight > chatBox.clientHeight);
    }

    function buildLine(extraClass, nickname, avatarUrl, badge) {
      const line = document.createElement("div");
      line.className = extraClass ? `chat-line ${extraClass}` : "chat-line";

      const header = document.createElement("div");
      header.className = "line-header";
      const avatar = createAvatar(avatarUrl);
      if (avatar) header.appendChild(avatar);
      if (badge) header.appendChild(badge);
      const nick = document.createElement("span");
      nick.className = "nickname";
      nick.textContent = nickname;
      header.appendChild(nick);

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      line.appendChild(header);
      line.appendChild(bubble);
      return { line, bubble };
    }

    function addChatLine(nickname, comment, avatarUrl) {
      const { line, bubble } = buildLine("", nickname, avatarUrl, null);
      bubble.innerHTML = `<span class="comment">${comment}</span>`;
      pushLine(line);
    }

    function addGiftLine(nickname, giftName, repeatCount, avatarUrl) {
      const badge = createBadge("badge-gift", "🎁");
      const { line, bubble } = buildLine("gift-line", nickname, avatarUrl, badge);
      const times = repeatCount > 1 ? ` <span class="gift-count">x${repeatCount}</span>` : "";
      bubble.innerHTML = `<span class="comment">ส่ง ${giftName}${times}</span>`;
      pushLine(line);
    }

    function addMemberLine(nickname, avatarUrl) {
      const badge = createBadge("badge-member", "💗");
      const { line, bubble } = buildLine("member-line", nickname, avatarUrl, badge);
      bubble.innerHTML = `<span class="comment">เข้าห้องไลฟ์</span>`;
      pushLine(line);
    }

    // ---- mock data (preview only, loops every 2s) ----
    addChatLine("YumeWatcher", "こんばんは〜 配信楽しみ");
    addChatLine("月見_Sub", "今日のゲーム最高 応援してます");
    const MOCK_GIFTS = [
      ["SakuraVIP", "Rose", 1],
      ["YumeWatcher", "Perfume", 5],
      ["月見_Sub", "Galaxy", 12],
    ];
    let mockIndex = 0;
    setInterval(() => {
      const [nickname, giftName, repeatCount] = MOCK_GIFTS[mockIndex % MOCK_GIFTS.length];
      addGiftLine(nickname, giftName, repeatCount);
      celebrateGift();
      mockIndex++;
    }, 2000);
  </script>
</body>
</html>
