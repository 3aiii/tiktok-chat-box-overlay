<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Follow Alert</title>
<link rel="stylesheet" href="/widgets/follow/follow.css" />
</head>
<body>
  <div id="stage" class="p-gone">
    <div id="pill">
      <div id="sweep-clip" aria-hidden="true"><div id="sweep"></div></div>

      <div id="avatar-wrap">
        <div class="wv" aria-hidden="true"></div>
        <div class="wv w2" aria-hidden="true"></div>
        <div id="confetti" aria-hidden="true"></div>
        <svg id="ring-svg" aria-hidden="true" viewBox="0 0 60 60">
          <circle cx="30" cy="30" r="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"></circle>
          <circle id="ring" cx="30" cy="30" r="28" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="176"></circle>
        </svg>
        <div id="face">
          <span id="initial"></span>
          <img id="avatar-img" alt="" referrerpolicy="no-referrer" />
        </div>
        <div id="plus">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
      </div>

      <div id="text">
        <div id="label" class="txt t1">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 0 Q12 12 24 12 Q12 12 12 24 Q12 12 0 12 Q12 12 12 0 Z"></path></svg>
          <span>NEW FOLLOWER · ผู้ติดตามใหม่</span>
        </div>
        <div id="name"></div>
        <div id="thanks" class="txt t3">ขอบคุณที่กดติดตามนะ</div>
      </div>

      <div id="chip">
        <div id="hearts" aria-hidden="true"></div>
        <svg id="beat" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.8-9C.6 8.6 2.6 4.5 6.6 4.5c2.3 0 3.8 1.3 5.4 3.2 1.6-1.9 3.1-3.2 5.4-3.2 4 0 6 4.1 4.4 7.5C19.5 16.4 12 21 12 21z"></path></svg>
        <span>Follow</span>
      </div>
    </div>
  </div>

  <script src="/widgets/shared/shared.js"></script>
  <script src="/widgets/follow/follow.js"></script>
</body>
</html>
