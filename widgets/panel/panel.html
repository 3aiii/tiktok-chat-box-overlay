<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Pin Control Panel</title>
<link rel="stylesheet" href="/widgets/panel/panel.css" />
</head>
<body>
  <header>
    <h1>Pin Control Panel</h1>
    <p>คลิกคอมเมนต์เพื่อปักหมุดขึ้นหน้า /pinned — คลิกซ้ำเพื่อเลิกปักหมุด</p>
    <div class="controls">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input id="search" type="text" placeholder="ค้นหาคอมเมนต์หรือชื่อ…" />
      </div>
      <div class="segmented" id="auto-unpin" data-value="30000">
        <span class="seg-label">auto-unpin</span>
        <button type="button" data-value="0">ปิด</button>
        <button type="button" data-value="15000">15s</button>
        <button type="button" data-value="30000" class="active">30s</button>
        <button type="button" data-value="60000">60s</button>
      </div>
      <button type="button" class="summary-btn" id="show-summary">📊 แสดงสรุป</button>
    </div>
  </header>
  <section id="timer-panel">
    <div class="timer-panel-head">
      <h2>BRB Timer</h2>
      <div class="timer-readout" id="timer-readout">05:00</div>
    </div>
    <div class="timer-controls">
      <div class="segmented" id="timer-presets">
        <span class="seg-label">เริ่มด่วน</span>
        <button type="button" data-ms="60000">1m</button>
        <button type="button" data-ms="300000">5m</button>
        <button type="button" data-ms="600000">10m</button>
        <button type="button" data-ms="900000">15m</button>
      </div>
      <div class="timer-custom">
        <input id="timer-min" type="number" min="0" max="99" value="5" />
        <span>นาที</span>
        <input id="timer-sec" type="number" min="0" max="59" value="0" />
        <span>วินาที</span>
        <button type="button" class="timer-btn primary" id="timer-start">▶ เริ่ม</button>
      </div>
      <div class="timer-message-row">
        <input id="timer-message" type="text" placeholder="ข้อความ BRB…" value="พักเบรกสักครู่ เดี๋ยวกลับมา" />
        <button type="button" class="timer-btn" id="timer-pause">⏸ พัก</button>
        <button type="button" class="timer-btn" id="timer-resume">▶ เล่นต่อ</button>
        <button type="button" class="timer-btn" id="timer-reset">↺ รีเซ็ต</button>
      </div>
    </div>
  </section>
  <div id="pinned-bar">
    <span class="pin-dot"></span>
    <span class="text"><b id="pinned-bar-nick"></b> <span id="pinned-bar-comment"></span></span>
    <span id="pinned-bar-auto" class="auto-flag"></span>
    <button class="clear-btn" id="pinned-bar-clear">เลิกปักหมุด</button>
  </div>
  <div id="list-wrap">
    <div id="list"></div>
    <div id="empty">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span id="empty-text">รอคอมเมนต์เข้ามา…</span>
    </div>
  </div>

  <script src="/widgets/shared/shared.js"></script>
  <script src="/widgets/panel/panel.js"></script>
</body>
</html>
